<svg viewBox="0 0 44 44" width="44" height="44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2AD" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="logoFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2AD" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="logoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F2AD" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00F2AD" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Sharp faceted outer container (cut-corner hexagon/diamond shield) -->
  <polygon points="22,2.5 40.5,11.5 40.5,32.5 22,41.5 3.5,32.5 3.5,11.5" 
           fill="#070A14" 
           stroke="url(#logoBorder)" 
           stroke-width="1.8" 
           stroke-linejoin="miter" />

  <!-- Subtle precision grid accents -->
  <line x1="22" y1="2.5" x2="22" y2="41.5" stroke="rgba(255,255,255,0.05)" stroke-width="0.8" />
  <line x1="3.5" y1="11.5" x2="40.5" y2="32.5" stroke="rgba(255,255,255,0.03)" stroke-width="0.8" />

  <g filter="url(#logoGlow)">
    <!-- Left vertical pillar with sharp chamfered ends -->
    <polygon points="12,12.5 17,9.5 17,34.5 12,31.5" fill="url(#logoFill)" />
    
    <!-- Sharp upper faceted loop of R -->
    <polygon points="17,9.5 27,9.5 33,15 33,20.5 27.5,25 17,25 17,20.5 26,20.5 29,17.5 29,16.5 26,13.5 17,13.5" fill="url(#logoFill)" />
    
    <!-- Dynamic sharp diagonal blade (R kick) -->
    <polygon points="22,23.5 32.5,34.5 27,34.5 17.5,24.5" fill="url(#logoFill)" />
    
    <!-- Sharp A apex / chevron accent -->
    <polygon points="22,14.5 25.5,18.5 18.5,18.5" fill="url(#logoAccent)" />
  </g>
</svg>
