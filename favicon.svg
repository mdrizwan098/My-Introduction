<svg viewBox="0 0 44 44" width="44" height="44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2AD" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="favFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2AD" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="favAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F2AD" />
    </linearGradient>
  </defs>
  
  <!-- Sharp faceted hexagon frame -->
  <polygon points="22,2.5 40.5,11.5 40.5,32.5 22,41.5 3.5,32.5 3.5,11.5" 
           fill="#070A14" 
           stroke="url(#favBorder)" 
           stroke-width="1.8" 
           stroke-linejoin="miter" />
  
  <!-- Sharp Monogram RA Core -->
  <!-- Left vertical pillar with sharp chamfered ends -->
  <polygon points="12,12.5 17,9.5 17,34.5 12,31.5" fill="url(#favFill)" />
  
  <!-- Sharp upper faceted loop of R -->
  <polygon points="17,9.5 27,9.5 33,15 33,20.5 27.5,25 17,25 17,20.5 26,20.5 29,17.5 29,16.5 26,13.5 17,13.5" fill="url(#favFill)" />
  
  <!-- Dynamic sharp diagonal blade (R kick) -->
  <polygon points="22,23.5 32.5,34.5 27,34.5 17.5,24.5" fill="url(#favFill)" />
  
  <!-- Sharp A apex / chevron accent -->
  <polygon points="22,14.5 25.5,18.5 18.5,18.5" fill="url(#favAccent)" />
</svg>
